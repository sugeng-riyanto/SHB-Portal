# /etc/nginx/sites-available/portal.scangrade.web.id
#
# Reverse proxy untuk SHB Portal (Django) di 127.0.0.1:8001.
# Ganti server block mana pun yang sekarang menjawab 403 untuk host ini:
# symlink berkas ini ke sites-enabled, lalu `nginx -t && systemctl reload nginx`.
#
# 403 yang muncul saat ini berasal dari nginx, bukan dari Django: semua path
# (termasuk /robots.txt dan /.well-known/) dijawab 403 dengan badan halaman
# bawaan nginx, sementara host lain di IP yang sama menjawab 200.

server {
    listen 80;
    listen [::]:80;
    server_name portal.scangrade.web.id;

    # Renewal Let's Encrypt lewat webroot; jangan diarahkan ke aplikasi.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.scangrade.web.id;

    # Sertifikat yang sudah aktif (Let's Encrypt, berlaku s.d. 26 Jan 2027).
    ssl_certificate     /etc/letsencrypt/live/portal.scangrade.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.scangrade.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log warn;

    # Unggahan bukti transfer (gambar) dan impor XLSX melewati proxy ini.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # collectstatic menulis ke STATIC_ROOT = <BASE_DIR>/staticfiles.
    # root: harus bisa dibaca www-data, kalau tidak nginx menjawab 403.
    location /static/ {
        alias /srv/shb-portal/staticfiles/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Berkas bukti transfer bersifat privat dan harus lewat otorisasi Django.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
