{% extends 'portal/base.html' %}{% block content %}<section class="card auth-card"><h1>Ubah bukti transfer</h1><p>Bukti hanya dapat diubah sebelum diverifikasi.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" enctype="multipart/form-data" class="auth-form">{% csrf_token %}<p><label for="amount">Nominal transfer (Rp)</label><input id="amount" name="amount" type="number" min="1" value="{{ proof.reported_amount }}" required></p><p><label for="transfer_date">Tanggal transfer</label><input id="transfer_date" name="transfer_date" type="date" value="{{ proof.transfer_date|date:'Y-m-d' }}" required></p><p><label for="image">Ganti foto JPG/PNG (opsional)</label><input id="image" name="image" type="file" accept="image/jpeg,image/png"></p><button class="button">Simpan perubahan</button></form><form method="post" action="{% url 'proof_withdraw' proof.pk %}">{% csrf_token %}<button type="submit">Tarik bukti</button></form></section>{% endblock %}
