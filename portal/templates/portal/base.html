<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHB Portal</title><style>body{font:16px system-ui;color:#183058;background:#f4f7fc;margin:0}header,main{padding:1rem 5%}header{background:#182e68;color:white;border-bottom:5px solid #24724a}header a{color:white}main{max-width:1100px;margin:auto}.card{background:white;border-radius:12px;padding:1.2rem;margin:1rem 0;border:1px solid #dce5ef}a,button{color:#174188}button{padding:.6rem}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:.7rem}@media(max-width:600px){.scroll{overflow:auto}table{min-width:570px}}</style></head><body><header><strong>SHB Portal</strong> · <a href="/">Beranda</a>{% if user.is_authenticated %} · <a href="/dashboard/">Dashboard</a><form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button>Keluar</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
