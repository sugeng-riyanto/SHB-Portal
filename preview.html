;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row strong{font-size:13px}.pill{border-radius:99px;background:#e8f7f2;color:#25866f;padding:5px 9px;font-size:11px;white-space:nowrap}.pill.warn{background:#fff4e1;color:#a26a17}.auth{max-width:440px;margin:35px auto;padding:30px}.auth label{display:block;margin:15px 0 6px;font-weight:700;font-size:12px}.auth input,.auth select{width:100%;padding:12px;border:1px solid #dce5ef;border-radius:9px;background:white}.auth .btn{width:100%;margin-top:18px}.link{background:none;border:0;color:var(--blue);padding:4px 0;font-weight:700}.note{background:#eef4ff;border:1px solid #dbe7ff;border-radius:10px;padding:12px;color:#546c91;font-size:12px;line-height:1.5;margin:15px 0}.footer{text-align:center;color:#91a0b0;padding:25px}.hide{display:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #91b3ff;outline-offset:2px}@media(max-width:850px){.features,.stats{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.side{display:flex;gap:5px;overflow:auto}.side button{width:auto;white-space:nowrap}.grid{grid-template-columns:1fr}}@media(max-width:480px){main{padding:20px 4%}.stat strong{font-size:20px}.features,.stats{gap:8px}.feature,.stat{padding:13px}.auth{padding:22px}.switch{gap:5px}.switch button{font-size:12px;padding:7px}.donut-wrap{gap:15px}}

function toggleWA(){document.getElementById('wa-dialog').classList.toggle('hide')}function toggleTheme(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('hb-theme',dark?'dark':'light')}catch(e){}document.getElementById('theme-toggle').textContent=dark?'☀ Light mode':'☾ Dark mode'}try{document.documentElement.dataset.theme=localStorage.getItem('hb-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}document.getElementById('theme-toggle').textContent=document.documentElement.dataset.theme==='dark'?'☀ Light mode':'☾ Dark mode';let language='id';const enMap={'Landing page':'Home','Sign in':'Sign in','Aktivasi':'Activate','Lupa password':'Forgot password','Admin sekolah':'School admin','Kepala sekolah':'Principal','Yayasan':'Foundation','Wali kelas':'Homeroom teacher','Orang tua':'Parent / guardian','Log out':'Log out','Ringkasan':'Overview','Impor XLSX':'Import XLSX','Unduh XLSX':'Download XLSX','Bagikan akun':'Share accounts','Rekening bank':'Bank accounts','Anak saya':'My children','Bukti saya':'My payment proofs','Bukti transfer':'Transfer proofs','Batas tagihan':'Due dates','Pengaturan sekolah':'School settings','Filter data':'Filter data','Tagihan & pembayaran':'Bills & payments','Murid & wali':'Students & guardians','Tahun ajaran':'Academic year','Pengumuman':'Announcements','Kirim pesan':'Send message','Pengiriman email':'Email delivery','Audit & pengaturan':'Audit & settings','Pesan masuk':'Inbox','Tagihan anak':'Children’s bills','Riwayat pembayaran':'Payment history','Profil & bantuan':'Profile & help','Profil':'Profile','Keluar':'Log out','Masuk →':'Sign in →','PRATINJAU · DATA CONTOH':'PREVIEW · SAMPLE DATA','Selamat datang 👋':'Welcome 👋','Laporan sekolah':'School reports','Tren bulanan':'Monthly trends','Laporan jenjang':'Level reports','Tren tahunan':'Yearly trends','Murid kelas saya':'My class students','Status tagihan':'Bill status'};function translateVisible(){if(language!=='en')return;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){const t=n.nodeValue.trim();if(enMap[t])n.nodeValue=n.nodeValue.replace(t,enMap[t])}}function toggleLanguage(){language=language==='id'?'en':'id';document.getElementById('lang-toggle').textContent=language==='id'?'EN':'ID';show(current);if(language==='en')translateVisible()}new MutationObserver(()=>translateVisible()).observe(document.getElementById('app'),{childList:true,subtree:true});const pages=[['landing','Landing page'],['signin','Sign in'],['activate','Aktivasi'],['forgot','Lupa password'],['admin','Admin sekolah'],['kepala','Kepala sekolah'],['yayasan','Yayasan'],['wali','Wali kelas'],['ortu','Orang tua'],['logout','Log out']];let current='landing';const app=document.getElementById('app');function show(id){current=id;document.getElementById('nav').innerHTML=pages.map(([key,label])=>`<button class="${id===key?'active':''}" onclick="show('${key}')">${label}</button>`).join('');if(id==='landing')landing();else if(['signin','activate','forgot','logout'].includes(id))auth(id);else dashboard(id);window.scrollTo({top:0,behavior:'smooth'})}
function landing(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">PORTAL INFORMASI SEKOLAH & ORANG TUA</div><h1>Informasi pembayaran,<br><span style="color:#315fda">lebih mudah dan jelas.</span></h1><p class="lead">Satu tempat untuk melihat tagihan, mengikuti pengumuman sekolah, dan menjaga komunikasi dengan keluarga.</p><button class="btn" onclick="show('signin')">Masuk ke portal →</button> <button class="btn alt" onclick="show('activate')">Aktivasi akun</button><p>Sudah menerima undangan? Aktifkan akun melalui tautan pada email sekolah.</p></div><div class="hero-art"><div class="eyebrow">RINGKASAN PORTAL</div><h2>Semua informasi, dalam satu tempat.</h2><div class="fake"><span style="height:42%"></span><span style="height:65%"></span><span style="height:48%"></span><span style="height:80%"></span><span style="height:66%"></span><span style="height:95%"></span></div><div class="row"><strong>Tagihan dan riwayat</strong><span class="pill">Mudah dipantau</span></div><div class="row"><strong>Pengumuman sekolah</strong><span class="pill">Selalu terhubung</span></div></div></section><div class="features"><div class="feature"><b>◎ Informasi jelas</b><span class="muted">Tagihan dan jatuh tempo dalam satu halaman.</span></div><div class="feature"><b>✉ Pengingat email</b><span class="muted">Pemberitahuan kepada wali yang terdaftar.</span></div><div class="feature"><b>◈ Akses sesuai peran</b><span class="muted">Informasi disesuaikan dengan kewenangan.</span></div><div class="feature"><b>▣ Nyaman di ponsel</b><span class="muted">Tampilan menyesuaikan perangkat Anda.</span></div></div>`}
function auth(id){let titles={signin:['Selamat datang kembali','Masuk untuk melihat informasi yang sesuai dengan akun Anda.'],activate:['Aktivasi akun','Buat kata sandi untuk mulai menggunakan portal.'],forgot:['Lupa kata sandi?','Kami akan membantu Anda mendapatkan tautan pengaturan ulang.'],logout:['Anda telah keluar','Terima kasih telah menggunakan portal sekolah.']};let [title,sub]=titles[id];let form='';if(id==='logout')form=`<button class="btn" onclick="show('signin')">Masuk kembali</button><button class="link" onclick="show('landing')">Kembali ke halaman utama</button>`;else if(id==='signin')form=`<label for="email">Email</label><input id="email" type="email" placeholder="nama@email.com"><label for="pass">Kata sandi</label><input id="pass" type="password" placeholder="Masukkan kata sandi"><div style="text-align:right;margin-top:8px"><button class="link" onclick="show('forgot')">Lupa kata sandi?</button></div><div class="note">Mode pratinjau: pilih peran untuk melihat contoh dashboard. Tidak ada proses login sungguhan.</div><label for="role">Pilih contoh peran</label><select id="role"><option value="admin">Admin sekolah</option><option value="kepala">Kepala sekolah</option><option value="yayasan">Yayasan</option><option value="wali">Wali kelas</option><option value="ortu">Orang tua</option></select><button class="btn" onclick="show(document.getElementById('role').value)">Lihat dashboard →</button><p>Belum aktif? <button class="link" onclick="show('activate')">Aktivasi akun</button></p>`;else if(id==='activate')form=`<div class="note">Di aplikasi sebenarnya, halaman ini dibuka melalui tautan undangan yang valid dari sekolah.</div><label for="pw1">Kata sandi baru</label><input id="pw1" type="password" placeholder="Buat kata sandi"><label for="pw2">Konfirmasi kata sandi</label><input id="pw2" type="password" placeholder="Ulangi kata sandi"><button class="btn" onclick="notice('Aktivasi ini hanya simulasi. Akun belum dibuat.')">Aktifkan akun</button><p><button class="link" onclick="show('signin')">← Kembali ke masuk</button></p>`;else form=`<label for="resetemail">Email terdaftar</label><input id="resetemail" type="email" placeholder="nama@email.com"><button class="btn" onclick="notice('Jika email terdaftar, petunjuk akan dikirim. Ini hanya simulasi; tidak ada email yang dikirim.')">Kirim tautan reset</button><p><button class="link" onclick="show('signin')">← Kembali ke masuk</button></p>`;app.innerHTML=`<div class="auth"><div class="eyebrow">PORTAL SEKOLAH</div><h2 style="margin-top:12px">${title}</h2><p>${sub}</p>${form}<div id="message" role="status"></div></div>`}function notice(s){document.getElementById('message').innerHTML=`<div class="note">${s}</div>`}

function dueFromDashboard(){let el=[...document.querySelectorAll('.side button')].find(x=>x.textContent.includes('Batas tagihan'));if(el)section(el,'Batas tagihan')}function compose(){document.querySelector('.content').innerHTML=`<div class="welcome"><div><div class="eyebrow">ADMIN SEKOLAH / KOMUNIKASI</div><h2>Kirim pesan</h2><p>Susun pemberitahuan untuk wali murid melalui beberapa kanal.</p></div></div><div class="note">Simulasi: tidak ada pesan atau data yang dikirim. Penerima dan status di bawah adalah contoh.</div><div class="grid"><div class="card"><h3>1. Pilih penerima</h3><label for="target" style="display:block;margin:15px 0 7px">Cakupan pengiriman</label><select id="target" onchange="targetChange()" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"><option>Semua wali (bulk)</option><option>Per kelas</option><option>Individu</option><option>Pilihan khusus</option></select><div id="target-detail"></div><h3 style="margin-top:22px">2. Pilih kanal</h3><p><label><input type="checkbox" checked disabled> Pesan di akun wali</label></p><p><label><input type="checkbox" id="mail" checked> Email pribadi</label></p><p><label><input type="checkbox" id="wa"> WhatsApp (rencana integrasi resmi)</label></p><div class="note">Penerima maksimal tiga wali per murid. Alamat dan nomor harus terverifikasi; pengiriman diperiksa satu per satu.</div></div><div class="card"><h3>3. Susun pesan</h3><label for="subject" style="display:block;margin:15px 0 7px">Judul</label><input id="subject" value="Pemberitahuan pembayaran sekolah" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"><label for="msg" style="display:block;margin:15px 0 7px">Isi pesan khusus</label><textarea id="msg" rows="7" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit">Yth. Bapak/Ibu {nama_wali},&#10;&#10;Kami menginformasikan bahwa terdapat tagihan untuk {nama_murid}. Silakan periksa rincian melalui portal sekolah.&#10;&#10;Terima kasih.&#10;Administrasi Sekolah Harapan Bangsa</textarea><p>Variabel: {nama_wali}, {nama_murid}, {kelas}, {jatuh_tempo}</p><button class="btn" onclick="previewMsg()">Tinjau penerima & pesan →</button><div id="compose-result" aria-live="polite"></div></div></div><div class="card"><h3>Status per penerima dan kanal</h3><p>Contoh: status inbox, email dan WhatsApp dicatat terpisah.</p><div style="overflow:auto"><table style="width:100%;min-width:570px;text-align:left;border-collapse:collapse"><tr><th>Wali</th><th>Kelas</th><th>Inbox</th><th>Email</th><th>WhatsApp</th></tr><tr><td>Wali contoh 1</td><td>7A</td><td>Terkirim</td><td>Terkirim</td><td>Pending</td></tr><tr><td>Wali contoh 2</td><td>8B</td><td>Terkirim</td><td>Gagal</td><td>Belum dipilih</td></tr></table></div><div class="note">Terkirim ke penyedia belum tentu diterima atau dibaca. Email gagal dapat ditinjau dan dicoba ulang tanpa menggandakan pesan.</div></div>`}function targetChange(){let v=document.getElementById('target').value,d=document.getElementById('target-detail');d.innerHTML=v==='Per kelas'?'<label for="class-choice">Pilih kelas</label><select id="class-choice" style="width:100%;padding:12px">'+['7A','7B','8A','8B','9A','9B','10A','10N','11','12'].map(x=>'<option>'+x+'</option>').join('')+'</select>':v==='Individu'?'<label for="person">Cari nama murid atau wali</label><input id="person" placeholder="Nama atau NIS" style="width:100%;padding:12px">':v==='Pilihan khusus'?'<p>Pilih beberapa wali dari daftar penerima saat sistem tersedia.</p>':''}function previewMsg(){let target=document.getElementById('target').value;let wa=document.getElementById('wa').checked;let channels='Inbox'+(document.getElementById('mail').checked?' + Email':'')+(wa?' + WhatsApp':'');document.getElementById('compose-result').innerHTML='<div class="note"><b>Preview simulasi</b><br>Target: '+target+'<br>Kanal: '+channels+'<br>Jumlah penerima dan pesan personal diverifikasi setelah data terhubung. '+(wa?'WhatsApp memerlukan nomor, persetujuan wali dan template resmi yang sesuai. ':'')+'Tidak ada pesan yang dikirim.</div>'}function section(el,name){if(name==='Pengaturan sekolah' && current==='admin'){schoolSettings(el);return}if(name==='Tagihan anak' && current==='ortu'){parentBills(el);return}if(name==='Bukti saya' && current==='ortu'){parentProof(el);return}if(name==='Bukti transfer'){staffProof(el);return}if(name==='Impor XLSX'){importView(el);return}if(name==='Filter data'){filterView(el);return}if(name==='Kirim pesan'){document.querySelectorAll('.side button').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');compose();return}if(name==='Ringkasan'){dashboard(current);return}document.querySelectorAll('.side button').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');let v=views[name]||views['Profil'];let content=document.querySelector('.content');content.innerHTML=`<div class="welcome"><div><div class="eyebrow">${data[current].title.toUpperCase()} / ${name.toUpperCase()}</div><h2>${v.title}</h2><p>${v.desc}</p></div><button class="btn alt small" onclick="show('logout')">Keluar</button></div><div class="note">Tampilan contoh: tombol dan data belum terhubung ke sistem sekolah.</div><div class="card"><div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px">${v.actions.map(a=>`<button class="btn small" onclick="demoAction()">${a}</button>`).join('')}</div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left;min-width:400px"><thead><tr>${v.cols.map(c=>`<th style="padding:12px;border-bottom:1px solid var(--line)">${c}</th>`).join('')}</tr></thead><tbody>${v.rows.map(row=>`<tr>${row.map(c=>`<td style="padding:14px 12px;border-bottom:1px solid var(--line)">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div id="section-info" aria-live="polite"></div></div>`}function parentBills(el){setSelected(el);document.querySelector('.content').innerHTML=`<div class="welcome"><div><div class="eyebrow">ORANG TUA / TAGIHAN ANAK</div><h2>Tagihan anak</h2><p>Pilih anak dan salin nomor VA untuk melakukan pembayaran.</p></div></div><div class="note">Semua angka dan nomor di halaman ini adalah contoh. Tidak ada tagihan sungguhan.</div><div class="card"><label for="kid">Pilih anak</label><p><select id="kid"><option>Anak contoh 1 · 7A</option><option>Anak contoh 2 · 10N</option></select></p><h3>SPP Oktober · Rp 500.000</h3><p>Virtual account contoh</p><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><strong id="va-number" style="font-size:22px">8800 1234 5678 9012</strong><button class="btn alt" onclick="copyVA()">Salin VA</button></div><p id="va-status" role="status"></p><button class="btn" onclick="parentProof(null)">Unggah bukti transfer →</button></div>`}async function copyVA(){let v=document.getElementById('va-number').textContent.replace(/ /g,'');try{await navigator.clipboard.writeText(v);document.getElementById('va-status').textContent='Nomor VA contoh disalin.'}catch(e){document.getElementById('va-status').textContent='Salin manual nomor VA contoh: '+v}}
function parentProof(el){if(el)setSelected(el);document.querySelector('.content').innerHTML=`<div class="welcome"><div><div class="eyebrow">ORANG TUA / BUKTI TRANSFER</div><h2>Bukti pembayaran saya</h2><p>Tambahkan bukti dan nominal untuk diverifikasi administrasi.</p></div></div><div class="note">Simulasi. Foto dan data tidak disimpan atau dikirim. Bukti yang dikirim bukan tanda pembayaran telah diverifikasi.</div><div class="grid"><div class="card"><h3>Tambah bukti</h3><p><label for="proof-child">Anak</label><br><select id="proof-child"><option>Anak contoh 1 · 7A</option><option>Anak contoh 2 · 10N</option></select></p><p><label for="proof-bill">Tagihan</label><br><select id="proof-bill"><option>SPP Oktober · contoh</option></select></p><p><label for="proof-amount">Nominal transfer (Rp)</label><br><input id="proof-amount" inputmode="numeric" type="number" min="1" placeholder="500000"></p><p><label for="proof-date">Tanggal transfer</label><br><input type="date" id="proof-date"></p><p><label for="proof-photo">Foto bukti transfer</label><br><input id="proof-photo" type="file" accept="image/*" onchange="photoPreview(this)"></p><img id="proof-preview" alt="Preview foto bukti transfer" style="display:none;max-width:100%;max-height:260px;border-radius:8px"><p><button class="btn" onclick="proofDemo()">Simpan bukti</button></p><div id="proof-note" role="status"></div></div><div class="card"><h3>Riwayat bukti saya</h3><div class="row"><div><strong>SPP Oktober · Anak contoh 1</strong><div class="muted">Rp 500.000 · contoh</div></div><span class="pill warn">Menunggu verifikasi</span></div><p>Anda dapat melihat, mengubah, atau menarik bukti sendiri sebelum diverifikasi.</p><button class="btn alt small" onclick="proofDemo()">Lihat</button> <button class="btn alt small" onclick="proofDemo()">Ubah</button> <button class="btn alt small" onclick="proofDemo()">Tarik bukti</button><p>Setelah diverifikasi, koreksi dilakukan melalui administrasi agar riwayat tetap utuh.</p></div></div>`}function photoPreview(input){let f=input.files[0],img=document.getElementById('proof-preview');if(!f)return;if(!f.type.startsWith('image/')){document.getElementById('proof-note').textContent='Pilih file gambar.';return}img.src=URL.createObjectURL(f);img.style.display='block'}function proofDemo(){document.getElementById('proof-note').textContent='Simulasi: tidak ada data yang disimpan, diubah, atau dikirim.'}
function staffProof(el){setSelected(el);let canVerify=current==='admin';document.querySelector('.content').innerHTML=`<div class="welcome"><div><div class="eyebrow">${data[current].title.toUpperCase()} / BUKTI TRANSFER</div><h2>Bukti transfer</h2><p>Preview foto dan nominal sesuai kewenangan dan lingkup akses.</p></div></div><div class="note">Data contoh. Wali kelas hanya melihat bukti kelas yang ditugaskan; kepala sekolah sesuai lingkup. Verifikasi pembayaran dilakukan admin.</div><div class="card"><div class="row"><div><strong>Anak contoh · SPP Oktober</strong><div class="muted">Nominal dilaporkan: Rp 500.000 · 27 Okt 2026</div></div><span class="pill warn">Menunggu verifikasi</span></div><p>Foto: bukti-contoh.jpg</p><button class="btn alt" onclick="document.getElementById('staff-msg').textContent='Foto contoh belum tersedia pada preview ini.'">Preview foto</button> ${canVerify?'<button class="btn" onclick="document.getElementById(\'staff-msg\').textContent=\'Simulasi: tidak ada pembayaran yang diverifikasi.\'">Verifikasi pembayaran</button>':''}<div id="staff-msg" class="note" role="status">Tidak ada foto atau pembayaran sungguhan dalam preview.</div></div>`}
function schoolSettings(el){setSelected(el);document.querySelector('.content').innerHTML=`<div class="welcome"><div><div class="eyebrow">ADMIN SEKOLAH / PENGATURAN</div><h2>Pengaturan sekolah</h2><p>Atur logo, WhatsApp admin dan jadwal peringatan tagihan.</p></div></div><div class="note">Simulasi: perubahan dan logo tidak disimpan atau diterapkan ke seluruh portal.</div><div class="grid"><div class="card"><h3>Identitas & kontak</h3><p><label for="logo">Logo sekolah</label><br><input id="logo" type="file" accept="image/png,image/jpeg,image/svg+xml" onchange="logoPreview(this)"></p><img id="logo-preview" alt="Preview logo sekolah" style="display:none;max-width:160px;max-height:100px"><p><label for="wa-admin">Nomor WhatsApp admin</label><br><input id="wa-admin" type="tel" placeholder="Contoh: 628123456789" style="padding:10px;width:100%"></p><p>Nomor akan diperiksa dan diverifikasi sebelum tombol chat diaktifkan.</p></div><div class="card"><h3>Jadwal alert tagihan</h3><p><label for="due-days">Hari sebelum jatuh tempo</label><br><input id="due-days" type="number" min="0" placeholder="Contoh: 7" style="padding:10px;width:100%"></p><p><label><input type="checkbox"> Ingatkan pada hari jatuh tempo</label></p><p><label><input type="checkbox"> Ingatkan setelah jatuh tempo</label></p><p>Jadwal sebenarnya ditentukan oleh admin. Tagihan lunas tidak dikirimi pengingat.</p></div></div><div class="card"><button class="btn" onclick="document.getElementById('settings-msg').textContent='Simulasi: pengaturan belum disimpan.'">Simpan pengaturan</button> <button class="btn alt" onclick="document.getElementById('settings-msg').textContent='Simulasi: tidak ada perubahan yang dihapus.'">Hapus / nonaktifkan</button><p id="settings-msg" role="status"></p></div>`}function logoPreview(input){let f=input.files[0];if(!f)return;let img=document.getElementById('logo-preview');img.src=URL.createObjectURL(f);img.style.display='block'}
function setSelected(el){document.querySelectorAll('.side button').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
function importView(el){setSelected(el);document.querySelector('.content').innerHTML=`<div class="welcome"><div><div class="eyebrow">ADMIN SEKOLAH</div><h2>Unggah XLSX</h2><p>Impor murid, wali, akun undangan, atau tagihan beserta VA / referensi rekening.</p></div></div><div class="note">Simulasi: file tidak dibaca atau diunggah. Di sistem final, admin memeriksa validasi dan penerima sebelum menyimpan atau mengirim undangan.</div><div class="card"><label for="import-type">Jenis data</label><p><select id="import-type" style="padding:12px"><option>Murid dan wali</option><option>Tagihan</option><option>Undangan akun</option></select></p><label for="xlsx-file">Pilih file .xlsx</label><p><input type="file" id="xlsx-file" accept=".xlsx"></p><button class="btn" onclick="importPreview()">Preview validasi</button> <button class="btn alt" onclick="demoAction()">Unduh template XLSX</button><div id="section-info" aria-live="polite"></div></div>`}function importPreview(){let f=document.getElementById('xlsx-file').files[0];document.getElementById('section-info').textContent=f?'File dipilih: '+f.name+'. Simulasi; isi file belum dibaca.':'Pilih file XLSX terlebih dahulu.'}function filterView(el){setSelected(el);document.querySelector('.content').innerHTML=`<div class="welcome"><div><div class="eyebrow">ADMIN SEKOLAH</div><h2>Filter data</h2><p>Pilih filter untuk murid, tagihan, akun dan status pengiriman.</p></div></div><div class="card"><form onsubmit="event.preventDefault();document.getElementById('filter-result').textContent='Filter dipilih. Hasil data akan tersedia setelah sistem terhubung.'"><div class="features"><label>Tahun ajaran<select style="display:block;padding:10px"><option>2026/2027</option><option>2025/2026</option></select></label><label>Jenjang<select style="display:block;padding:10px"><option>Semua</option><option>SMP</option><option>SMA</option></select></label><label>Kelas<select style="display:block;padding:10px"><option>Semua</option>${['7A','7B','8A','8B','9A','9B','10A','10N','11','12'].map(c=>`<option>${c}</option>`).join('')}</select></label><label>Status<select style="display:block;padding:10px"><option>Semua</option><option>Lunas</option><option>Belum lunas</option><option>Pending</option><option>Terkirim</option><option>Gagal</option><option>Aktif</option></select></label></div><p><button class="btn">Terapkan filter</button> <button class="btn alt" type="reset">Reset filter</button></p><div id="filter-result" class="note" role="status">Data contoh; belum terhubung ke database.</div></form></div>`}
function demoAction(){document.getElementById('section-info').innerHTML='<div class="note">Ini contoh tampilan. Fungsi akan tersedia setelah sistem dibangun.</div>'}
show('landing');</script></body></html>
